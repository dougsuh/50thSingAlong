<style>
:root { color-scheme: light; --ink:#20242b; --blue:#0070C0; --red:#ff0000; --paper:#fffdf8; --accent:#245b8f; }
* { box-sizing:border-box; }
body { margin:0; background:linear-gradient(135deg,#eaf1f7,#f8f4ec); color:var(--ink);
       font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; min-height:100vh; }
header { padding:20px 18px 8px; text-align:center; }
header h1 { margin:0; font-size:clamp(1.5rem,4vw,2.2rem); letter-spacing:.04em; }
header p { margin:8px 0 0; color:#68717c; }
main { width:min(100% - 28px, 1000px); margin:18px auto 30px; }
.panel { background:var(--paper); border:1px solid #dce2e8; border-radius:20px;
         box-shadow:0 12px 34px #26384a18; padding:clamp(18px,4vw,38px); }
#cover { text-align:center; }
#cover h2 { font-size:1.5rem; margin:4px 0 8px; }
#cover .hint { color:#68717c; margin:0 0 26px; }
.song-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; }
.song-link { display:flex; align-items:center; gap:14px; text-align:left; padding:18px;
             border:1px solid #d6e0e9; border-radius:14px; background:#f6f9fc; color:var(--ink);
             font:inherit; cursor:pointer; transition:.15s; }
.song-link:hover { background:#eaf3fb; transform:translateY(-2px); border-color:#8eafcb; }
.song-number { display:grid; place-items:center; width:42px; height:42px; flex:none;
               border-radius:50%; background:#245b8f; color:white; font-weight:700; }
.song-name { font-weight:700; line-height:1.4; }
#song-page { display:none; }
.song-heading { text-align:center; border-bottom:1px solid #e5e8eb; padding-bottom:16px; margin-bottom:22px; }
.song-heading h2 { margin:0; font-size:clamp(1.35rem,3vw,1.9rem); }
.song-heading .count { color:#78828c; margin-top:7px; font-size:.95rem; }
.lyrics { text-align:center; }
.text-block { margin:0 auto 22px; }
.lyric-line { font-size:clamp(1.02rem,2.4vw,1.42rem); line-height:1.9; min-height:1.9em;
              overflow-wrap:anywhere; }
.navigation { display:flex; justify-content:space-between; align-items:center; gap:10px;
              margin-top:28px; flex-wrap:wrap; }
.nav-btn { border:0; border-radius:12px; padding:13px 19px; font:inherit; font-weight:700;
           cursor:pointer; background:#245b8f; color:white; }
.nav-btn.secondary { background:#e9eef3; color:#263746; }
.nav-btn:hover { filter:brightness(.95); }
.nav-center { display:flex; gap:9px; flex-wrap:wrap; justify-content:center; }
@media(max-width:520px) {
 .navigation { justify-content:center; }
 .navigation > button { flex:1; }
 .nav-center { order:3; width:100%; }
 .lyric-line { line-height:1.75; }
}
</style>
</head>

</section>
<section id="song-page" class="panel" aria-live="polite">

  </nav>
</section>
</main>

\">&nbsp;</span><span style=\"color:#000000\">나만의</span><span style=\"color:#000000\">&nbsp;</span><span style=\"color:#000000\">꿈의</span><span style=\"color:#000000\">&nbsp;</span><span style=\"color:#000000\">대화를</span></div><div class=\"lyric-line\"><span style=\"color:#FF0000\">외로움이</span><span style=\"color:#FF0000\">&nbsp;</span><span style=\"color:#FF0000\">없단다</span><span style=\"color:#FF0000\">&nbsp;</span><span style=\"color:#FF0000\">우리들의</span><span style=\"color:#FF0000\">&nbsp;꿈&nbsp;</span><span style=\"color:#FF0000\">속엔</span><span style=\"color:#0070C0\">서러움도</span><span style=\"color:#0070C0\">&nbsp;</span><span style=\"color:#0070C0\">없어라</span><span style=\"color:#0070C0\">&nbsp;</span><span style=\"color:#0070C0\">너와</span><span style=\"color:#0070C0\">&nbsp;</span><span style=\"color:#0070C0\">나의</span><span style=\"color:#0070C0\">&nbsp;</span><span style=\"color:#0070C0\">눈빛에</span><span style=\"color:#000000\">마음</span><span style=\"color:#000000\">&nbsp;</span><span style=\"color:#000000\">깊은</span><span style=\"color:#000000\">&nbsp;</span><span style=\"color:#000000\">곳에서</span><span style=\"color:#000000\">&nbsp;</span><span style=\"color:#000000\">우리</span><span style=\"color:#000000\">&nbsp;</span><span style=\"color:#000000\">함께</span><span style=\"color:#000000\">&nbsp;</span><span style=\"color:#000000\">나누자</span><span style=\"color:#000000\">&nbsp;</span><span style=\"color:#000000\">너와</span><span style=\"color:#000000\">&nbsp;나</span><span style=\"color:#000000\">너와</span><span style=\"color:#000000\">&nbsp;나&nbsp;</span><span style=\"color:#000000\">너와</span><span style=\"color:#000000\">&nbsp;</span><span style=\"color:#000000\">나만의</span><span style=\"color:#000000\">&nbsp;</span><span style=\"color:#000000\">꿈의</span><span style=\"color:#000000\">&nbsp;</span><span style=\"color:#000000\">대화를</span><span style=\"color:#000000\">에&nbsp;</span><span style=\"color:#000000\">에</span><span style=\"color:#000000\">&nbsp;</span><span style=\"color:#000000\">에</span><span style=\"color:#000000\">&nbsp;</span><span style=\"color:#000000\">에</span><span style=\"color:#000000\">&nbsp;</span><span style=\"color:#000000\">에</span><span style=\"color:#000000\">&nbsp;</span><span style=\"color:#000000\">에</span><span style=\"color:#000000\">&nbsp;</span><span style=\"color:#000000\">에</span><span style=\"color:#000000\">&nbsp;</span><span style=\"color:#000000\">에</span></div></section>"}];
let current = 0;
const cover = document.getElementById('cover');
const page = document.getElementById('song-page');
const list = document.getElementById('song-list');
songs.forEach((song, i) => {
  const button = document.createElement('button');
  button.className = 'song-link';
  button.innerHTML = `<span class="song-number">${i+1}</span><span class="song-name"></span>`;
  button.querySelector('.song-name').textContent = song.title;
  button.addEventListener('click', () => showSong(i));
  list.appendChild(button);
});
function showSong(index) {
  current = (index + songs.length) % songs.length;
  const song = songs[current];
  document.getElementById('song-title').textContent = song.title;
  document.getElementById('song-count').textContent = `${current+1} / ${songs.length}`;
  document.getElementById('lyrics').innerHTML = song.content;
  cover.style.display = 'none';
  page.style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function showCover() {
  page.style.display = 'none';
  cover.style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
}
document.getElementById('prev').addEventListener('click', () => showSong(current - 1));
document.getElementById('next').addEventListener('click', () => showSong(current + 1));
document.getElementById('home').addEventListener('click', showCover);
</script>
