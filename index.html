<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=5.0, user-scalable=yes">
  <title>70년대 고등학교 음악책</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #0a1a3c; /* 어두운 청색 */
      color: #ffffff; /* 흰색 가사 */
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    #main-page,
    #song-page {
      width: 100%;
      max-width: 720px;
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      padding: 12px 14px 14px;
      flex-direction: column;
    }

    /* 첫 메인 페이지는 기본 표시 */
    #main-page {
      display: flex;
    }

    /* 노래 페이지는 초기 숨김 */
    #song-page {
      display: none;
    }

    /* 메인 페이지 */
    .main-header {
      text-align: center;
      padding: 4px 0 10px;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      margin-bottom: 8px;
    }

    .main-header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
    }

    .song-list {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
    }

    .song-btn {
      flex: 1 0 auto;
      width: 100%;
      min-height: 36px;
      padding: 6px 12px;
      background-color: #163168;
      color: #ffffff;
      border: 1px solid #3b63b8;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .song-btn:active,
    .song-btn:hover {
      background-color: #244a96;
    }

    .song-btn-num {
      color: #93c5fd;
      margin-right: 6px;
      font-weight: 700;
    }

    .song-btn-sub {
      font-size: 12px;
      color: #b8d0ff;
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 38%;
    }

    /* 개별 노래 페이지 */
    .song-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      flex-shrink: 0;
    }

    .song-title-wrap {
      min-width: 0;
      flex: 1;
    }

    .song-title {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.25;
      word-break: keep-all;
    }

    .song-meta {
      margin-top: 3px;
      font-size: 13px;
      color: #b8d0ff;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .note-badge {
      display: inline-block;
      padding: 1px 6px;
      background-color: rgba(255, 255, 255, 0.16);
      border-radius: 4px;
      color: #fde047;
      font-weight: 700;
      font-size: 12px;
    }

    /* 확대/축소 버튼 */
    .zoom-controls {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .zoom-btn {
      height: 32px;
      min-width: 32px;
      padding: 0 7px;
      background-color: #163168;
      color: #ffffff;
      border: 1px solid #3b63b8;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .zoom-btn:active,
    .zoom-btn:hover {
      background-color: #244a96;
    }

    /* 가사 영역 */
    .lyrics-viewport {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 4px 2px 8px;
      -webkit-overflow-scrolling: touch;
    }

    .lyrics-content {
      white-space: pre-wrap;
      word-break: keep-all;
      color: #ffffff;
      line-height: 1.55;
      font-size: 17px;
      font-weight: 500;
    }

    /* 기타 코드 (빨간색) */
    .chord {
      color: #ff3333;
      font-weight: 800;
    }

    /* 하단 버튼 3개: 동일한 크기와 모양 */
    .nav-bar {
      display: flex;
      gap: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      flex-shrink: 0;
    }

    .nav-btn {
      flex: 1;
      width: 0;
      height: 48px;
      background-color: #1d4ed8;
      color: #ffffff;
      border: 1px solid #60a5fa;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:active,
    .nav-btn:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>

  <!-- 메인 페이지 (버튼을 HTML에 직접 배치) -->
  <section id="main-page">
    <header class="main-header">
      <h1>70년대 고등학교 음악책</h1>
    </header>
    <div id="song-list" class="song-list">
      <button type="button" class="song-btn" onclick="openSong(0)"><span><span class="song-btn-num">1.</span>거룩한 천사의 음성</span><span class="song-btn-sub">Alice Hawthorne</span></button>
      <button type="button" class="song-btn" onclick="openSong(1)"><span><span class="song-btn-num">2.</span>메기의 추억</span><span class="song-btn-sub">버터필드 작곡</span></button>
      <button type="button" class="song-btn" onclick="openSong(2)"><span><span class="song-btn-num">3.</span>스와니강의 노래(1851)</span><span class="song-btn-sub">포스터</span></button>
      <button type="button" class="song-btn" onclick="openSong(3)"><span><span class="song-btn-num">4.</span>켄터키 옛집(1853)</span><span class="song-btn-sub">포스터 Foster</span></button>
         <button type="button" class="song-btn" onclick="openSong(4)"><span><span class="song-btn-num">5.</span>아 목동아</span><span class="song-btn-sub">아일랜드 민요</span></button>
      <button type="button" class="song-btn" onclick="openSong(5)"><span><span class="song-btn-num">6.</span>로렐라이 언덕 DIE LORELEI (1823)</span><span class="song-btn-sub">Heine · Silcher</span></button>
      <button type="button" class="song-btn" onclick="openSong(6)"><span><span class="song-btn-num">7.</span>들장미</span><span class="song-btn-sub">베르너 작곡</span></button>
      <button type="button" class="song-btn" onclick="openSong(7)"><span><span class="song-btn-num">8.</span>보리수</span><span class="song-btn-sub">슈베르트</span></button>
      <button type="button" class="song-btn" onclick="openSong(8)"><span><span class="song-btn-num">9.</span>산타루치아</span></button>
      <button type="button" class="song-btn" onclick="openSong(9)"><span><span class="song-btn-num">10.</span>돌아오라 소렌토로</span></button>
      <button type="button" class="song-btn" onclick="openSong(11)"><span><span class="song-btn-num">11.</span>즐거운 나의 집</span></button>
    </div>
  </section>

  <!-- 개별 노래 페이지 -->
  <section id="song-page">
    <header class="song-header">
      <div class="song-title-wrap">
        <h2 id="song-title" class="song-title"></h2>
        <div id="song-meta" class="song-meta"></div>
      </div>
      <div class="zoom-controls" aria-label="글자 크기 조절">
        <button type="button" class="zoom-btn" onclick="changeZoom(-2)" title="축소">−</button>
        <button type="button" class="zoom-btn" onclick="fitLyricsToScreen()" title="화면 맞춤">맞춤</button>
        <button type="button" class="zoom-btn" onclick="changeZoom(2)" title="확대">+</button>
      </div>
    </header>

    <main id="lyrics-viewport" class="lyrics-viewport">
      <div id="lyrics-content" class="lyrics-content"></div>
    </main>

    <nav class="nav-bar" aria-label="곡 이동">
      <button type="button" class="nav-btn" onclick="prevSong()">◀ 이전</button>
      <button type="button" class="nav-btn" onclick="goMain()">메인</button>
      <button type="button" class="nav-btn" onclick="nextSong()">다음 ▶</button>
    </nav>
  </section>

  <script>
    var songs = [
      {
        title: "거룩한 천사의 음성",
        info: "미국 Alice Hawthorne, 1827~1902",
        notes: "3/4 EE",
        lyrics:
          "{A}거룩한 천사의 음성 {D}내 귀를 두드리{A}네\n" +
          "부드럽게 속삭{D}이는 {E}앞날의 그 언약{A}을\n" +
          "어두운 밤 지나가고 {E}폭풍우 개이면{A}은\n" +
          "동녘엔 광명의 햇빛 눈부시{E}게 비치{A}네\n" +
          "속삭이는 앞날{E}의 보금{A}자리 \n{D}즐거움{A}이 눈앞{E}에 어린{A}다." 
      },
      {
        title: "메기의 추억",
        info: "버터필드 작곡",
        notes: "4/4  GG",
        lyrics:
          "옛날{C}에 금잔{C7}디 동산{F}에 \n메기 같{C}이 앉아서 놀던 {G}곳\n" +
          "물레{C}방아소{C7}리 들린{F}다 \n메기 내 {C}사랑하{G}는 메기{C}야{C7}\n" +
          "동산{F}수풀은 우거지{C}고 \n장미화{G}는 피어 {D7}만발하였{G}다\n" +
          "물레{C}방아 소리 그쳤{F}다\n" +
          "메기 내 {C}사랑하{G}는 메기{C}야" 
      },
      {
        title: "스와니강의 노래(1851)",
        info: "포스터",
        notes: "4/4  EDC",
        lyrics:
          "{C}머나먼 저곳 {F}스와니 강물 {C}그리워{G}라\n" +
          "{C}날 사랑하는 {F}부모형제 \n{C}이 몸을 {G}기다{C}려\n" +
          "{G}이 세상에 {C}정처 없는 {F}나그네의 {G}길\n" +
          "{C}아 그리워라 {F}나 살던 곳 {C}멀고먼 {G}옛 고{C}향"
      },
      {
        title: "켄터키 옛집(1853)",
        info: "포스터 Foster",
        notes: "4/4  G#G#",
        lyrics:
          "켄{E}터키 옛집에 {A}햇빛 비치{E}어 \n여름날 검둥이 시{B}절\n" +
          "저 {E}새는 긴 날을 {A}노래 부를 {E}때 \n옥수수는 벌써 {B}익었{E}네\n" +
          "마루를 구르며 {A}노는 어린 {E}것 \n세상을 모르고 노{B}나\n" +
          "어{E}려운 시절이 {A}닥쳐오리{E}니 \n잘 쉬어라 켄터{B}키 옛{E}집\n" +
          "잘 쉬{A}어라 {E}쉬어 울{A}지 말{E}고 쉬어\n" +
          "그리운 저 켄터키 {A}옛집 위하{E}여 \n머나{B}먼 집 노래 부르{E}네."
      },
      {
        title: "아 목동아",
        info: "아일랜드 민요",
        notes: "4/4  CDE",
        lyrics:
          "아 목동{C}들의 피리소리{F}들은\n" +
          "산골짝{C}마다 울려 나오{G}고\n" +
          "여름은 {C}가고 꽃은 떨어{F}지니\n" +
          "너도 가{C}고 또 {G}나도 가야{C}지\n" +
          "{G}저 목장{C}에는 {F}여름철이 {C}오고\n" +
          "{G}산골짝{C}마다 {F}눈이 덮여{G}도\n" +
          "나 항상 {C}오래 {F}여기 살{C}리라\n" +
          "{G}아 목동{C}아  아 목동{G}아 내 {F}사{G}랑{C}아"
      },
      {
        title: "로렐라이 언덕 DIE LORELEI (1823)",
        info: "Poem by Heinrich Heine · Music by Friedrich Silcher",
        notes: "3/4  GG",
        lyrics:
          "옛{C}날부터 전해오{Dm}는 쓸{C}쓸한 {G}이 말{C}이\n" +
          "가슴속에 그립게{Dm}도 끝{C}없이 {G}떠오른{C}다.\n" +
          "구{G}름 걷힌 하늘아{Am}래 고{G}요한 라인 강\n" +
          "저{C}녁 빛이 찬란하{G}다. 로{C}렐라{G}이 언{C}덕"
      },
      {
        title: "들장미",
        info: "베르너 작곡",
        notes: "6/8  EE",
        lyrics:
          "{C}웬 아이가 {G}보았네 \n{C}들에 피인 장{F}미{G}화\n" +
          "갓 피{C}어난 어여쁜 그 향기에 {F}탐나{G}서\n" +
          "{C}정신없이 {G}보네 {C}장미{F}화야 {G}장미{C}화\n" +
          "들에 피인 {G}장미{C}화" 
      },
      {
        title: "보리수",
        info: "슈베르트",
        notes: "3/4  AA",
        lyrics:
          "성{D}문 앞 샘물 곁에 \n서 {A}있는 보리{D}수\n" +
          "나는 그 그늘 아래 \n단{A}꿈을 보았{D}네\n" +
          "가{A}지에 희망의 {D}말 새{G}기어놓고{A}서\n" +
          "기쁘나 슬플 때{D}나 \n찾아온 {A}나무 {D}밑\n" +
          "찾아온 {A}나무 {D}밑" 
      },
      {
        title: "산타루치아",
        info: "",
        notes: "3/4  EE",
        lyrics:
          "창{A}공에 빛난 {E}별 물{D}위에 어리{A}어 \n{A}바람은 {D}고요히 불어오{A}누나\n" +
          "창{A}공에 빛난 {E}별 물{D}위에 어리{A}어 \n{A}바람은 {D}고요히 불어오{A}누나\n" +
          "{A}내 배는 {E}살같이 바다를 {A}지난다 \n산타루{D}치아 {E}산타루{A}치아\n" +
          "{A}내 배는 {E}살같이 바다를 {A}지난다 \n산타루{D}치아 {E}산타루{A}치아"
      },
      {
        title: "돌아오라 소렌토로",
        info: "Curtis",
        notes: "3/4  ABC",
        lyrics:
          "{Am}아름다운 저 바다와 {Dm}그리운 저 빛난 {Am}햇빛\n" +
          "{F}내 맘속에 잠시{Am}라도 {E}떠날 때가 없도{A}다.\n" +
          "향기로운 꽃 만{D}발한 {E}아름다운 동산{A}에서\n" +
          "내게 준 그 귀한{D}언약 {E}어이하여 잊을{A}까\n" +
          "멀리 떠나간 그{D}대를 {E}나는 홀로 사모하{Am}여\n" +
          "{Am}잊지못할 이 곳에서 {E}기다리고 잊노{A}라\n" +
          "{A}돌{E}아오{Dm}라 이곳을 잊지{Am}말고\n" +
          "{Dm}돌아오라 소렌토로 돌{E}아오{Am}라"
      },
      {
        title: "즐거운 나의 집",
        info: "",
        notes: "CE",
        lyrics:
          "즐{C}거운 곳에서는 \n날 {G7}오라 하여{C}도\n" +
          "내 {C}쉴 곳은 작은 \n집 {G7}내 집 뿐이{C}리\n" +
          "내 나{F}라 내 {C}기쁨 \n길{G7}이 쉴 곳{C}도\n" +
          "꽃 피{F}고 새 {C}우는 \n집 {G7}내 집 뿐이{C}리\n" +
          "오 {G7}사랑 {F}나{G7}의 {C}집\n" +
          "즐거{F}운 나{C}의 벗 \n집 {G7}내 집 뿐이{C}리"
      }
    ];

    var currentIndex = 0;
    var currentFontSize = 18;

    function formatLyrics(raw) {
      return raw.replace(/\{([^}]+)\}/g, '<span class="chord">$1</span>');
    }

    function openSong(index) {
      currentIndex = index;
      var song = songs[currentIndex];

      document.getElementById("main-page").style.display = "none";
      document.getElementById("song-page").style.display = "flex";

      document.getElementById("song-title").textContent = (currentIndex + 1) + ". " + song.title;

      var metaHTML = "";
      if (song.info) {
        metaHTML += "<span>" + song.info + "</span>";
      }
      if (song.notes) {
        metaHTML += '<span class="note-badge">' + song.notes + "</span>";
      }
      var metaEl = document.getElementById("song-meta");
      metaEl.innerHTML = metaHTML;
      metaEl.style.display = metaHTML ? "flex" : "none";

      var viewport = document.getElementById("lyrics-viewport");
      var content = document.getElementById("lyrics-content");
      content.innerHTML = formatLyrics(song.lyrics);
      viewport.scrollTop = 0;
      viewport.scrollLeft = 0;

      requestAnimationFrame(fitLyricsToScreen);
    }

    function fitLyricsToScreen() {
      var viewport = document.getElementById("lyrics-viewport");
      var content = document.getElementById("lyrics-content");
      var availableHeight = viewport.clientHeight - 12;
      if (availableHeight <= 0) return;

      var low = 11;
      var high = 30;
      var best = low;

      while (low <= high) {
        var mid = Math.floor((low + high) / 2);
        content.style.fontSize = mid + "px";

        if (content.scrollHeight <= availableHeight) {
          best = mid;
          low = mid + 1;
        } else {
          high = mid - 1;
        }
      }

      currentFontSize = best;
      content.style.fontSize = currentFontSize + "px";
      viewport.scrollTop = 0;
    }

    function changeZoom(delta) {
      var content = document.getElementById("lyrics-content");
      currentFontSize = Math.max(10, Math.min(44, currentFontSize + delta));
      content.style.fontSize = currentFontSize + "px";
    }

    function goMain() {
      document.getElementById("song-page").style.display = "none";
      document.getElementById("main-page").style.display = "flex";
    }

    function prevSong() {
      var prevIndex = (currentIndex - 1 + songs.length) % songs.length;
      openSong(prevIndex);
    }

    function nextSong() {
      var nextIndex = (currentIndex + 1) % songs.length;
      openSong(nextIndex);
    }

    window.addEventListener("resize", function () {
      if (document.getElementById("song-page").style.display === "flex") {
        fitLyricsToScreen();
      }
    });

    document.addEventListener("keydown", function (e) {
      if (document.getElementById("song-page").style.display !== "flex") return;
      if (e.key === "ArrowLeft") prevSong();
      else if (e.key === "ArrowRight") nextSong();
      else if (e.key === "Escape") goMain();
    });
  </script>
</body>
</html>
