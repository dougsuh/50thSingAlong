<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=5.0, user-scalable=yes">
  <title>70년대 고등학교 음악책</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #0a1a3c; /* 어두운 청색 */
      color: #ffffff; /* 흰색 가사 */
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    #main-page,
    #song-page {
      width: 100%;
      max-width: 720px;
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      padding: 12px 14px 14px;
      flex-direction: column;
    }

    /* 첫 메인 페이지는 기본 표시 */
    #main-page {
      display: flex;
    }

    /* 노래 페이지는 초기 숨김 */
    #song-page {
      display: none;
    }

    /* 메인 페이지 */
    .main-header {
      text-align: center;
      padding: 4px 0 10px;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      margin-bottom: 8px;
    }

    .main-header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
    }

    .song-list {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
    }

    .song-btn {
      flex: 1 0 auto;
      width: 100%;
      min-height: 36px;
      padding: 6px 12px;
      background-color: #163168;
      color: #ffffff;
      border: 1px solid #3b63b8;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .song-btn:active,
    .song-btn:hover {
      background-color: #244a96;
    }

    .song-btn-num {
      color: #93c5fd;
      margin-right: 6px;
      font-weight: 700;
    }

    .song-btn-sub {
      font-size: 12px;
      color: #b8d0ff;
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 38%;
    }

    /* 개별 노래 페이지 */
    .song-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      flex-shrink: 0;
    }

    .song-title-wrap {
      min-width: 0;
      flex: 1;
    }

    .song-title {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.25;
      word-break: keep-all;
    }

    .song-meta {
      margin-top: 3px;
      font-size: 13px;
      color: #b8d0ff;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .note-badge {
      display: inline-block;
      padding: 1px 6px;
      background-color: rgba(255, 255, 255, 0.16);
      border-radius: 4px;
      color: #fde047;
      font-weight: 700;
      font-size: 12px;
    }

    /* 확대/축소 버튼 */
    .zoom-controls {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .zoom-btn {
      height: 32px;
      min-width: 32px;
      padding: 0 7px;
      background-color: #163168;
      color: #ffffff;
      border: 1px solid #3b63b8;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .zoom-btn:active,
    .zoom-btn:hover {
      background-color: #244a96;
    }

    /* 가사 영역 */
    .lyrics-viewport {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 4px 2px 8px;
      -webkit-overflow-scrolling: touch;
    }

    .lyrics-content {
      white-space: pre-wrap;
      word-break: keep-all;
      color: #ffffff;
      line-height: 1.55;
      font-size: 17px;
      font-weight: 500;
    }

    /* 기타 코드 (빨간색) */
    .chord {
      color: #ff3333;
      font-weight: 800;
    }

    /* 하단 버튼 3개: 동일한 크기와 모양 */
    .nav-bar {
      display: flex;
      gap: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      flex-shrink: 0;
    }

    .nav-btn {
      flex: 1;
      width: 0;
      height: 48px;
      background-color: #1d4ed8;
      color: #ffffff;
      border: 1px solid #60a5fa;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:active,
    .nav-btn:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>

  <!-- 메인 페이지 (버튼을 HTML에 직접 배치) -->
  <section id="main-page">
    <header class="main-header">

      <button type="button" class="song-btn" onclick="openSong(1)"><span><span class="song-btn-num">2.</span>메기의 추억</span><span class="song-btn-sub">버터필드 작곡</span></button>
      <button type="button" class="song-btn" onclick="openSong(2)"><span><span class="song-btn-num">3.</span>스와니강의 노래(1851)</span><span class="song-btn-sub">포스터</span></button>

      <button type="button" class="song-btn" onclick="openSong(4)"><span><span class="song-btn-num">5.</span>언덕위의 집 Home on the range</span></button>
      <button type="button" class="song-btn" onclick="openSong(5)"><span><span class="song-btn-num">6.</span>아 목동아</span><span class="song-btn-sub">아일랜드 민요</span></button>
      <button type="button" class="song-btn" onclick="openSong(6)"><span><span class="song-btn-num">7.</span>로렐라이 언덕 DIE LORELEI (1823)</span><span class="song-btn-sub">Heine · Silcher</span></button>

      <button type="button" class="song-btn" onclick="openSong(12)"><span><span class="song-btn-num">13.</span>즐거운 나의 집</span></button>
    </div>
  </section>

  <!-- 개별 노래 페이지 -->
  <section id="song-page">
    <header class="song-header">
      <div class="song-title-wrap">
        <h2 id="song-title" class="song-title"></h2>
        <div id="song-meta" class="song-meta"></div>
      </div>
      <div class="zoom-controls" aria-label="글자 크기 조절">
        <button type="button" class="zoom-btn" onclick="changeZoom(-2)" title="축소">−</button>
        <button type="button" class="zoom-btn" onclick="fitLyricsToScreen()" title="화면 맞춤">맞춤</button>
        <button type="button" class="zoom-btn" onclick="changeZoom(2)" title="확대">+</button>
      </div>
    </header>

    <main id="lyrics-viewport" class="lyrics-viewport">
      <div id="lyrics-content" class="lyrics-content"></div>
    </main>

    <nav class="nav-bar" aria-label="곡 이동">
      <button type="button" class="nav-btn" onclick="prevSong()">◀ 이전</button>
      <button type="button" class="nav-btn" onclick="goMain()">메인</button>
      <button type="button" class="nav-btn" onclick="nextSong()">다음 ▶</button>
    </nav>
  </section>

          "오! {G}나의 나의 햇{D}님 찬란하{A}게 비치인{D}다!\n\n" +
          "{D}Che bella cosa na jurnata 'e {G}sole\n" +
          "{A}N'aria serena dopo na tem{D}pesta!\n" +
          "Pe' ll'aria fresca pare già na {G}festa\n" +
          "Che bella {D}cosa na jur{A}nata 'e {D}sole\n" +
          "{D}Ma n'atu sole   {A}Cchiu' bello, {D}oi ne'\n" +
          "{A}'O sole {G}mio  {A}Sta 'nfronte a {D}te!\n" +
          "'O {G}sole, 'o sole {D}mio  Sta 'nfronte a {A}te\n" +
          "Sta 'nfronte a {D}te!"
      },
      {
        title: "즐거운 나의 집",
        info: "",
        notes: "CE",
        lyrics:
          "{C}즐거운 {G7}곳에{C}서는 날 {G7}오라 하여{C}도\n" +
          "내 {C}쉴 {G7}곳은 {C}작은 집 {G7}내 집 뿐이{C}리\n" +
          "내 나{F}라 내 {C}기쁨 길{G7}이 쉴 곳{C}도\n" +
          "꽃 피고 {C}새 우는 집 {G7}내 집 뿐이{C}리\n" +
          "오 {G7}사랑 {F}나{G7}의 {C}집\n" +
          "즐거{F}운 {C}나의 벗{G7}내 집 뿐이{C}리"
      }
    ];

    var currentIndex = 0;
    var currentFontSize = 18;

    function formatLyrics(raw) {
      return raw.replace(/\{([^}]+)\}/g, '<span class="chord">$1</span>');
    }

    function openSong(index) {
      currentIndex = index;
      var song = songs[currentIndex];

      document.getElementById("main-page").style.display = "none";
      document.getElementById("song-page").style.display = "flex";

      document.getElementById("song-title").textContent = (currentIndex + 1) + ". " + song.title;

      var metaHTML = "";
      if (song.info) {
        metaHTML += "<span>" + song.info + "</span>";
      }
      if (song.notes) {
        metaHTML += '<span class="note-badge">' + song.notes + "</span>";
      }
      var metaEl = document.getElementById("song-meta");
      metaEl.innerHTML = metaHTML;
      metaEl.style.display = metaHTML ? "flex" : "none";

      var viewport = document.getElementById("lyrics-viewport");
      var content = document.getElementById("lyrics-content");
      content.innerHTML = formatLyrics(song.lyrics);
      viewport.scrollTop = 0;
      viewport.scrollLeft = 0;

      requestAnimationFrame(fitLyricsToScreen);
    }

    function fitLyricsToScreen() {
      var viewport = document.getElementById("lyrics-viewport");
      var content = document.getElementById("lyrics-content");
      var availableHeight = viewport.clientHeight - 12;
      if (availableHeight <= 0) return;

      var low = 11;
      var high = 30;
      var best = low;

      while (low <= high) {
        var mid = Math.floor((low + high) / 2);
        content.style.fontSize = mid + "px";

        if (content.scrollHeight <= availableHeight) {
          best = mid;
          low = mid + 1;
        } else {
          high = mid - 1;
        }
      }

      currentFontSize = best;
      content.style.fontSize = currentFontSize + "px";
      viewport.scrollTop = 0;
    }

    function changeZoom(delta) {
      var content = document.getElementById("lyrics-content");
      currentFontSize = Math.max(10, Math.min(44, currentFontSize + delta));
      content.style.fontSize = currentFontSize + "px";
    }

    function goMain() {
      document.getElementById("song-page").style.display = "none";
      document.getElementById("main-page").style.display = "flex";
    }

    function prevSong() {
      var prevIndex = (currentIndex - 1 + songs.length) % songs.length;
      openSong(prevIndex);
    }

    function nextSong() {
      var nextIndex = (currentIndex + 1) % songs.length;
      openSong(nextIndex);
    }

    window.addEventListener("resize", function () {
      if (document.getElementById("song-page").style.display === "flex") {
        fitLyricsToScreen();
      }
    });

    document.addEventListener("keydown", function (e) {
      if (document.getElementById("song-page").style.display !== "flex") return;
      if (e.key === "ArrowLeft") prevSong();
      else if (e.key === "ArrowRight") nextSong();
      else if (e.key === "Escape") goMain();
    });
  </script>
</body>
</html>
